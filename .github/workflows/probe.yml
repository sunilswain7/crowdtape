name: probe

# The authoritative capability check. Runs in CI because the developer's ISP resets
# connections to pro-api on SNI - see recorder/net.py. Trigger from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe key capability
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python3 scripts/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-output
          path: probe-output/
      - name: Publish the measured access table
        run: |
          git config user.name  "crowdtape-probe"
          git config user.email "probe@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && echo "access table unchanged" && exit 0
          git commit -m "probe: measured endpoint access $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main || true
          git push
