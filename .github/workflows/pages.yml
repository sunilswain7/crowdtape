name: pages

# Builds the Next.js board and publishes it with the recorder's data beside it. The app
# is a static export that fetches that JSON at runtime, so a new snapshot appears on the
# site without rebuilding anything - the rebuild here only happens when the code or the
# published data actually changes.
on:
  push:
    branches: [main]
    paths: ["web/**", "site/data/**", ".github/workflows/pages.yml"]
  # The recorder dispatches this after every commit. The schedule is the safety net for
  # a dispatch that never lands - without one the board silently freezes, which it did
  # for twenty-one hours before the cause was found.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write        # to restart the recorder if it has stopped

# Data lands every few minutes; collapsing rapid pushes into one deploy is the point.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
        env:
          PAGES: "1"
      - name: Place the recorded data beside it
        run: cp -r site/data web/out/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - id: deploy
        uses: actions/deploy-pages@v4

      # Watchdog. If a runner dies mid-loop the chain of dispatches breaks and only the
      # schedule is left, which GitHub honours erratically - that cost eight and a half
      # hours of snapshots on 28 Sep. This job runs far more often than the schedule does,
      # so it is the cheapest reliable place to notice and restart.
      - name: Restart the recorder if it has stopped
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          live=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/record.yml/runs?per_page=5" \
                   --jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued")] | length')
          if [ "$live" = "0" ]; then
            echo "recorder is not running — dispatching"
            gh workflow run record.yml --ref main
          else
            echo "recorder alive ($live run(s))"
          fi
