name: record

# Every 15 minutes on the free Basic tier (~480 credits/day against a 15,000 cap).
# Drop to */5 once the Startup upgrade lands and the cap becomes 450,000.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take snapshot
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python3 recorder/record.py
      - name: Commit
        run: |
          git config user.name  "crowdtape-recorder"
          git config user.email "recorder@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "nothing new" && exit 0
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main || true
          git push
