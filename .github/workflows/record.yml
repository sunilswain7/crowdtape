name: record

# The schedule only STARTS a job. The job then holds itself open and snapshots on its own
# clock - see recorder/loop.py for why cron alone produced four snapshots in nine hours.
on:
  # Hourly, not three-hourly. A runner can die mid-loop - one did on 26 Sep, four hours
  # into a run, with no step reporting an error - and until the next trigger arrives
  # nothing is recording. Three-hourly made that worth up to three hours of snapshots;
  # it cost two. Restarting is nearly free: concurrency cancels the old run, the new one
  # takes a snapshot immediately, and COMMIT_EVERY=1 means nothing uncommitted is lost.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      interval_s:
        description: "Seconds between snapshots"
        required: false
        default: "600"

permissions:
  contents: write
  actions: write        # to dispatch the pages deploy - a GITHUB_TOKEN push cannot

# A newer run replaces an older one, so a late trigger costs nothing.
concurrency:
  group: record
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Identify the recorder
        run: |
          git config user.name  "crowdtape-recorder"
          git config user.email "recorder@users.noreply.github.com"
      - name: Snapshot continuously
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          # The Startup upgrade landed on 22 Sep: 450,000 credits and 600 req/min. The
          # binding constraint is now repository size, not credits - a snapshot is ~57 KB
          # with the attention streams, so ten minutes is ~8 MB a day.
          SNAPSHOT_INTERVAL_S: ${{ github.event.inputs.interval_s || '600' }}
          # The 3-hourly trigger cancels the running job, so anything uncommitted dies
          # with it. Measured: four gaps of 20-24 min on 19 Sep. One commit per snapshot
          # costs nothing and bounds the loss at zero.
          COMMIT_EVERY: "1"
          # Every contract token, every third snapshot (30 min): ~137 x 48 = 6,600
          # credits/day against 450,000 a month. Wallet growth is the confident crowd
          # axis, so its resolution is worth spending on.
          HOLDERS_N: "200"
          HOLDERS_EVERY: "3"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 recorder/loop.py
