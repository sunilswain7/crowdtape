name: record

# The schedule only STARTS a job. The job then holds itself open and snapshots on its own
# clock - see recorder/loop.py for why cron alone produced four snapshots in nine hours.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      interval_s:
        description: "Seconds between snapshots"
        required: false
        default: "600"

permissions:
  contents: write

# A newer run replaces an older one, so a late trigger costs nothing.
concurrency:
  group: record
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Identify the recorder
        run: |
          git config user.name  "crowdtape-recorder"
          git config user.email "recorder@users.noreply.github.com"
      - name: Snapshot continuously
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          # 600s costs ~720 credits a day against the Basic tier's 15,000 a month.
          # Drop it once the Startup upgrade lands and the ceiling becomes 450,000.
          SNAPSHOT_INTERVAL_S: ${{ github.event.inputs.interval_s || '600' }}
          # The 3-hourly trigger cancels the running job, so anything uncommitted dies
          # with it. Measured: four gaps of 20-24 min on 19 Sep. One commit per snapshot
          # costs nothing and bounds the loss at zero.
          COMMIT_EVERY: "1"
          # Wallet counts on a slow cycle: 50 tokens every 18 snapshots (3 hours) is
          # 400 credits/day on top of the recorder's 720, inside the measured budget of
          # 14,111 credits and 10.7 days.
          HOLDERS_N: "50"
          HOLDERS_EVERY: "18"
        run: python3 recorder/loop.py
